<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Urban Fox Rentals — 3rd Floor</title>
<style>
  :root {
    --ink: #f0ddb8;
    --dim: #b89a72;
    --bar: #24160f;
    --bar-edge: #6b4a2e;
    --hud: 58px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070504; color: var(--ink); }
  body {
    font-family: "Courier New", Courier, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  body.touch { touch-action: none; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0 0 var(--hud) 0; }
  #view { width: 100%; height: 100%; display: block; image-rendering: auto; }
  #cross {
    position: absolute; left: 50%; top: 46%; width: 14px; height: 14px;
    transform: translate(-50%, -50%); pointer-events: none;
  }
  #cross::before, #cross::after {
    content: ""; position: absolute; background: rgba(240, 221, 184, 0.85);
  }
  #cross::before { left: 6px; top: 0; width: 2px; height: 14px; }
  #cross::after { left: 0; top: 6px; width: 14px; height: 2px; }
  #prompt {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    letter-spacing: 0.18em; font-size: 13px; color: var(--ink);
    text-shadow: 0 2px 0 #000; display: none;
  }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--hud);
    background: linear-gradient(#3a2418, var(--bar));
    border-top: 2px solid var(--bar-edge);
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    padding: 0 14px 0 8px; gap: 10px;
  }
  #titles { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  #titles b { font-size: 13px; letter-spacing: 0.12em; font-weight: 700; }
  #titles span { color: var(--dim); font-size: 11px; letter-spacing: 0.06em; }
  #hint {
    display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    color: var(--dim); font-size: 11px; letter-spacing: 0.08em;
  }
  .hintbit { flex: 0 0 auto; white-space: nowrap; }
  kbd {
    display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 3px;
    margin-right: 2px;
    border: 1px solid rgba(240, 221, 184, 0.45); border-bottom-width: 2px; border-radius: 3px;
    color: var(--ink); font: inherit; font-size: 10px; letter-spacing: 0;
    background: rgba(255, 255, 255, 0.05);
  }
  #cover {
    position: fixed; inset: 0; background: rgba(5, 3, 2, 0.78);
    display: flex; align-items: center; justify-content: center; text-align: center;
    z-index: 5; cursor: pointer;
  }
  #cover.hide { display: none; }
  #cover h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: 0.22em; font-weight: 700; }
  #cover h2 { margin: 0 0 28px; font-weight: 400; letter-spacing: 0.42em; color: var(--dim); font-size: 13px; }
  #cover p { margin: 0; letter-spacing: 0.28em; font-size: 14px; }
  #cover ul {
    list-style: none; padding: 22px 0 0; margin: 0; color: var(--dim);
    letter-spacing: 0.12em; line-height: 1.7; font-size: 12px;
  }
  #load {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #070504; z-index: 6; letter-spacing: 0.28em; font-size: 13px;
  }
  #load.hide { display: none; }
  #touch {
    display: none;
    position: fixed;
    inset: 0 0 var(--hud) 0;
    z-index: 4;
    touch-action: none;
  }
  body.touch #touch { display: block; }
  .floatstick {
    position: fixed;
    width: 108px; height: 108px;
    margin: -54px 0 0 -54px;
    border-radius: 50%;
    background: rgba(18, 12, 9, 0.32);
    border: 1px solid rgba(184, 154, 114, 0.55);
    display: none;
    pointer-events: none;
  }
  .floatstick.on { display: grid; place-items: center; }
  .floatstick .nub {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(240, 221, 184, 0.28);
    border: 1px solid rgba(240, 221, 184, 0.6);
  }
  #useBtn {
    position: absolute;
    right: max(16px, env(safe-area-inset-right));
    bottom: 16px;
    min-width: 64px; min-height: 40px;
    padding: 0 12px;
    font: inherit; letter-spacing: 0.14em; font-size: 12px;
    color: var(--ink);
    background: rgba(18, 12, 9, 0.55);
    border: 1px solid rgba(184, 154, 114, 0.55);
    border-radius: 14px;
    touch-action: none;
  }
  @media (max-width: 640px) {
    #cover h1 { font-size: 18px; }
  }
  /* Phone: a short label, with the controls in the bottom corners of the view. */
  body.touch { --hud: calc(40px + env(safe-area-inset-bottom)); }
  body.touch #hud {
    grid-template-columns: 1fr;
    padding: 0 12px 0 8px;
    gap: 8px;
  }
  body.touch #hint { display: none; }
  body.touch #titles b { font-size: 11px; letter-spacing: 0.08em; }
  body.touch #titles span { font-size: 10px; letter-spacing: 0.06em; }
  body.touch #useBtn {
    min-width: 58px; min-height: 36px;
    font-size: 11px;
  }
</style>
</head>
<body>
<div id="load">READING THE FLOOR PLAN</div>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="cross"></div>
  <div id="prompt">E &nbsp; OPEN</div>
</div>
<footer id="hud">
  <div id="titles">
    <b>URBAN FOX RENTALS</b>
    <span>3RD FLOOR UNIT</span>
  </div>
  <div id="hint">
    <span class="hintbit"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> MOVE</span>
    <span class="hintbit">MOUSE LOOK</span>
    <span class="hintbit"><kbd>E</kbd> USE</span>
    <span class="hintbit"><kbd>SHIFT</kbd> RUN</span>
  </div>
</footer>
<div id="cover">
  <div>
    <h1>URBAN FOX RENTALS</h1>
    <h2>3RD FLOOR UNIT</h2>
    <p id="startHint">CLICK TO EXPLORE</p>
    <ul id="startKeys">
      <li>WASD MOVE &nbsp;·&nbsp; MOUSE LOOK</li>
      <li>E USE &nbsp;·&nbsp; HOLD SHIFT TO RUN</li>
    </ul>
  </div>
</div>
<div id="touch">
  <div id="stickMove" class="floatstick" aria-hidden="true"><div class="nub"></div></div>
  <div id="stickLook" class="floatstick" aria-hidden="true"><div class="nub"></div></div>
  <button id="useBtn" type="button">USE</button>
</div>
<script src="vendor/three.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const view = $("view");
const keys = new Set();
const state = {
  started: false,
  tv: false,
  bedTv: false,
  yaw: 0.4,
  pitch: 0,
  x: 0, y: 1.65, z: 0,
  speed: 0,
};
const touchMove = { x: 0, y: 0 };
const touchLook = { x: 0, y: 0 };
const finePointer = window.matchMedia("(pointer: fine)").matches;
const touchPreferred = window.matchMedia("(pointer: coarse)").matches && !finePointer;
if (touchPreferred) {
  document.body.classList.add("touch");
  $("startHint").textContent = "TAP TO EXPLORE";
  $("startKeys").innerHTML = "<li>LEFT SIDE MOVE &nbsp;·&nbsp; RIGHT SIDE LOOK</li><li>USE OPENS AND STARTS THINGS</li>";
}

let level, blocked, inside, doorOwner;
let doors = [];
let renderer, scene, camera, ambient, hemi, ceiling, sun, roomEnv;
let cans = [];
let materials = [];
let audio, stepClock = 0, bob = 0;
let nearestDoor = null;
let nearestUse = null;
const fixtures = [];
let tvMat = null;
let bedMat = null;
let tvChannels = [];
let tvChannel = 0;
let bedView = null;
const tvNames = ["SOCCER", "BASKETBALL", "BASEBALL", "NEWS", "NATURE"];
let curtainRig = null;
let cabinets = [];
let drawers = [];
let windows = [];
let fridge = null;
let waterStreams = [];

function hexBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}

function cellIndex(x, z) {
  const c = Math.floor((x - level.origin[0]) / level.cell);
  const r = Math.floor((z - level.origin[1]) / level.cell);
  if (c < 0 || r < 0 || c >= level.gridW || r >= level.gridH) return -1;
  return r * level.gridW + c;
}

function blockedAt(x, z) {
  const i = cellIndex(x, z);
  if (i < 0 || !inside[i]) return true;
  const b = blocked[i];
  if (b === 0 || b === undefined) return false;
  if (b === 3) {
    const id = doorOwner[i] - 1;
    const door = doors[id];
    return !door || door.amount < 0.72;
  }
  return true;
}

function releaseDoor(ownerId, fill) {
  const W = level.gridW;
  for (let i = 0; i < doorOwner.length; i++) {
    if (doorOwner[i] !== ownerId) continue;
    const z = level.origin[1] + (Math.floor(i / W) + 0.5) * level.cell;
    doorOwner[i] = 0;
    if (blocked[i] === 3) blocked[i] = fill(z);
  }
}

function stampDoor(ownerId, x0, z0, x1, z1) {
  const cell = level.cell;
  const c0 = Math.floor((Math.min(x0, x1) - level.origin[0]) / cell);
  const c1 = Math.floor((Math.max(x0, x1) - level.origin[0]) / cell);
  const r0 = Math.floor((Math.min(z0, z1) - level.origin[1]) / cell);
  const r1 = Math.floor((Math.max(z0, z1) - level.origin[1]) / cell);
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      if (c < 0 || r < 0 || c >= level.gridW || r >= level.gridH) continue;
      const i = r * level.gridW + c;
      if (!inside[i] || blocked[i] === 1) continue;
      blocked[i] = 3;
      doorOwner[i] = ownerId;
    }
  }
}

function widenWalk() {
  const openProp = (x0, z0, x1, z1) => {
    const c0 = Math.floor((Math.min(x0, x1) - level.origin[0]) / level.cell);
    const c1 = Math.floor((Math.max(x0, x1) - level.origin[0]) / level.cell);
    const r0 = Math.floor((Math.min(z0, z1) - level.origin[1]) / level.cell);
    const r1 = Math.floor((Math.max(z0, z1) - level.origin[1]) / level.cell);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (c < 0 || r < 0 || c >= level.gridW || r >= level.gridH) continue;
        const i = r * level.gridW + c;
        if (blocked[i] === 2) blocked[i] = 0;
      }
    }
  };
  openProp(0.42, -3.05, 0.78, -1.28);
  openProp(1.22, -2.9, 1.62, -1.2);
  openProp(1.45, -1.2, 2.55, -0.5);
}

function peelWallSkin() {
  const W = level.gridW;
  const H = level.gridH;
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const core = (c, r) => {
    if (c < 0 || r < 0 || c >= W || r >= H || blocked[r * W + c] !== 1) return false;
    for (let i = 0; i < 4; i++) {
      const cc = c + dirs[i][0];
      const rr = r + dirs[i][1];
      if (cc < 0 || rr < 0 || cc >= W || rr >= H || blocked[rr * W + cc] !== 1) return false;
    }
    return true;
  };
  const kill = [];
  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const i = r * W + c;
      if (blocked[i] !== 1 || !inside[i]) continue;
      let exposed = false;
      let backed = false;
      for (let k = 0; k < 4; k++) {
        const cc = c + dirs[k][0];
        const rr = r + dirs[k][1];
        if (cc < 0 || rr < 0 || cc >= W || rr >= H) { exposed = true; continue; }
        if (blocked[rr * W + cc] !== 1) exposed = true;
        if (core(cc, rr)) backed = true;
      }
      if (exposed && backed) kill.push(i);
    }
  }
  kill.forEach((i) => { blocked[i] = 0; });
}

function tryMove(nx, nz) {
  const r = 0.02;
  const hits = (x, z) => blockedAt(x, z) || blockedAt(x + r, z) || blockedAt(x - r, z) || blockedAt(x, z + r) || blockedAt(x, z - r);
  if (!hits(nx, state.z)) state.x = nx;
  if (!hits(state.x, nz)) state.z = nz;
}

function makeMaterial(spec, texLoader) {
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(spec.color || "#cccccc"),
    roughness: 0.86,
    metalness: 0,
    side: THREE.DoubleSide,
  });
  mat.userData.role = spec.role || "";
  mat.userData.emissive = new THREE.Color(spec.emissive || "#000000");
  mat.emissive = mat.userData.emissive.clone();
  if (spec.opacity != null && spec.opacity < 1) {
    mat.transparent = true;
    mat.opacity = spec.opacity;
  }
  if (spec.map) {
    const tex = texLoader.load(spec.map);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    if (spec.repeat) tex.repeat.set(spec.repeat[0], spec.repeat[1]);
    if (spec.rough) tex.magFilter = THREE.NearestFilter;
    mat.map = tex;
  }
  materials.push(mat);
  return mat;
}

function buildMesh(bin, rec, mat) {
  const pos = new Float32Array(bin, rec.pos, rec.posCount * 3);
  const nrm = new Float32Array(bin, rec.nrm, rec.posCount * 3);
  const uv = new Float32Array(bin, rec.uv, rec.posCount * 2);
  const idx = new Uint32Array(bin, rec.idx, rec.idxCount);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("normal", new THREE.BufferAttribute(nrm, 3));
  geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function chooseSwing(door) {
  const [x0, z0, x1, z1] = door.meta.aabb;
  const dx = (x0 + x1) / 2 - door.meta.hinge[0];
  const dz = (z0 + z1) / 2 - door.meta.hinge[1];
  const score = (sign) => {
    const ox = sign > 0 ? -dz : dz;
    const oz = sign > 0 ? dx : -dx;
    return blockedAt(door.meta.hinge[0] + ox, door.meta.hinge[1] + oz) ? 0 : 1;
  };
  // Door cells still read as blocked while shut, so test the swung pose against walls only.
  const wallAt = (x, z) => {
    const i = cellIndex(x, z);
    return i < 0 || !inside[i] || blocked[i] === 1 || blocked[i] === 2;
  };
  const free = (sign) => {
    const ox = sign > 0 ? -dz : dz;
    const oz = sign > 0 ? dx : -dx;
    return wallAt(door.meta.hinge[0] + ox, door.meta.hinge[1] + oz) ? 0 : 1;
  };
  return free(1) >= free(-1) ? 1 : -1;
}

function oakPlanks() {
  const tex = paintTexture(1024, 1024, (g, w, h) => {
    const tones = ["#e4c39a", "#d7b184", "#c9a06e", "#edd4b2", "#c9a474", "#f0dcc0", "#d2a97a", "#e8cba6"];
    const rows = 10;
    const ph = h / rows;
    g.fillStyle = "#c4a078";
    g.fillRect(0, 0, w, h);
    for (let i = 0; i < rows; i++) {
      const y = i * ph;
      const boards = 2 + (i % 3 === 0 ? 1 : 0);
      let x = ((i * 173) % 220) - 80;
      for (let b = 0; b < boards + 2; b++) {
        const bw = w * (0.42 + ((i * 5 + b * 3) % 5) * 0.08);
        g.fillStyle = tones[(i + b) % tones.length];
        g.fillRect(x, y + 1, bw, ph - 2);
        g.strokeStyle = "rgba(92, 58, 28, 0.16)";
        g.lineWidth = 1;
        for (let k = 0; k < 4; k++) {
          const gy = y + 8 + ((k * 19 + i * 11 + b * 7) % (ph - 16));
          g.beginPath();
          g.moveTo(x + 8, gy);
          g.bezierCurveTo(x + bw * 0.3, gy + 3, x + bw * 0.65, gy - 2, x + bw - 10, gy + 1);
          g.stroke();
        }
        g.fillStyle = "rgba(110, 68, 28, 0.14)";
        g.beginPath();
        g.ellipse(x + bw * 0.45, y + ph * 0.55, 7, 4, 0.4, 0, Math.PI * 2);
        g.fill();
        x += bw;
      }
    }
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 10);
  tex.anisotropy = 16;
  return tex;
}

function wallPaint() {
  const tex = paintTexture(256, 256, (g, w, h) => {
    const img = g.createImageData(w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = 244 + Math.random() * 11;
      img.data[i] = n;
      img.data[i + 1] = n - 1;
      img.data[i + 2] = n - 3;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 6);
  tex.anisotropy = 8;
  return tex;
}

function buildRoomEnv() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  env.add(new THREE.HemisphereLight(0xfff8f2, 0xd7b48a, 1.4));
  const key = new THREE.DirectionalLight(0xffffff, 4);
  key.position.set(2, 6, 1);
  env.add(key);
  const shell = new THREE.Mesh(
    new THREE.BoxGeometry(18, 8, 18),
    new THREE.MeshStandardMaterial({ color: 0xf7f4ef, roughness: 1, side: THREE.BackSide })
  );
  env.add(shell);
  const oak = new THREE.Mesh(
    new THREE.PlaneGeometry(18, 18),
    new THREE.MeshStandardMaterial({ color: 0xc9a06a, roughness: 0.65 })
  );
  oak.rotation.x = -Math.PI / 2;
  env.add(oak);
  roomEnv = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
}

function finishPalette() {
  for (const mat of materials) {
    if (mat.userData.role === "material_5") {
      mat.color.set(0xffffff);
      mat.map = oakPlanks();
      mat.roughness = 0.58;
      mat.metalness = 0.02;
    } else if (mat.userData.role === "material_0" || mat.userData.role === "material_4") {
      mat.color.set(0xfbf9f6);
      mat.map = wallPaint();
      mat.roughness = 0.9;
    } else if (mat.userData.role === "material_chrome") {
      mat.metalness = 0.92;
      mat.roughness = 0.18;
    } else if (mat.userData.role === "material_ceramic") {
      mat.roughness = 0.35;
      mat.metalness = 0.04;
    }
  }
}

function applyLook() {
  ambient.intensity = 0.28;
  hemi.intensity = 0.45;
  hemi.color.set(0xfff8f2);
  hemi.groundColor.set(0xc4a078);
  if (sun) sun.intensity = 2.4;
  cans.forEach((lamp) => { lamp.intensity = 1.1; });
  scene.environment = roomEnv;
  renderer.shadowMap.enabled = true;
  ceiling.material.color.set(0xf7f4ef);
  ceiling.material.emissive.set(0xe7e2da);
  renderer.toneMappingExposure = 1.18;
  scene.fog = null;
  scene.background = new THREE.Color(0xd7dde4);
  for (const mat of materials) {
    if (mat.userData.sticky) continue;
    mat.emissive.copy(mat.userData.emissive);
  }
  showScreen(tvMat, state.tv, state.tv ? tvChannels[tvChannel] : null);
  showScreen(bedMat, state.bedTv, bedView);
  resize();
}

function resize() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const w = Math.max(160, Math.floor($("stage").clientWidth));
  const h = Math.max(120, Math.floor($("stage").clientHeight));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function doorLeaf(door) {
  const [x0, z0, x1, z1] = door.meta.aabb;
  const hx = door.meta.hinge[0];
  const hz = door.meta.hinge[1];
  const alongX = Math.abs(x1 - x0) >= Math.abs(z1 - z0);
  const slide = door.meta.motion === "slide";
  if (slide) {
    const ox = door.meta.slide[0] * door.amount;
    const oz = door.meta.slide[1] * door.amount;
    if (alongX) return { xA: x0 + ox, zA: (z0 + z1) / 2 + oz, xB: x1 + ox, zB: (z0 + z1) / 2 + oz };
    return { xA: (x0 + x1) / 2 + ox, zA: z0 + oz, xB: (x0 + x1) / 2 + ox, zB: z1 + oz };
  }
  const span = alongX ? ((x0 + x1) / 2 - hx) * 2 : ((z0 + z1) / 2 - hz) * 2;
  const lx = alongX ? span : 0;
  const lz = alongX ? 0 : span;
  const ang = door.amount * door.sign * Math.PI * 0.5;
  const c = Math.cos(ang);
  const s = Math.sin(ang);
  return { xA: hx, zA: hz, xB: hx + lx * c + lz * s, zB: hz - lx * s + lz * c };
}

function pointOnLeaf(px, pz, leaf) {
  const vx = leaf.xB - leaf.xA;
  const vz = leaf.zB - leaf.zA;
  const len2 = vx * vx + vz * vz || 1;
  let u = ((px - leaf.xA) * vx + (pz - leaf.zA) * vz) / len2;
  u = Math.max(0, Math.min(1, u));
  const sx = leaf.xA + u * vx;
  const sz = leaf.zA + u * vz;
  return Math.hypot(px - sx, pz - sz);
}

function rayLeaf(px, pz, dx, dz, leaf) {
  const vx = leaf.xB - leaf.xA;
  const vz = leaf.zB - leaf.zA;
  const wx = px - leaf.xA;
  const wz = pz - leaf.zA;
  const b = dx * vx + dz * vz;
  const c = vx * vx + vz * vz;
  const d = dx * wx + dz * wz;
  const e = vx * wx + vz * wz;
  const denom = c - b * b;
  let t;
  let u;
  if (c < 1e-8) {
    t = Math.max(0, -d);
    u = 0;
  } else if (Math.abs(denom) < 1e-6) {
    u = Math.max(0, Math.min(1, e / c));
    t = (leaf.xA + u * vx - px) * dx + (leaf.zA + u * vz - pz) * dz;
    if (t < 0) t = 0;
  } else {
    t = (b * e - c * d) / denom;
    u = (e - b * d) / denom;
    if (u < 0 || u > 1 || t < 0) {
      u = Math.max(0, Math.min(1, u));
      t = (leaf.xA + u * vx - px) * dx + (leaf.zA + u * vz - pz) * dz;
      if (t < 0) {
        t = 0;
        u = Math.max(0, Math.min(1, e / c));
      }
    }
  }
  const qx = px + t * dx;
  const qz = pz + t * dz;
  const sx = leaf.xA + u * vx;
  const sz = leaf.zA + u * vz;
  const dist = Math.hypot(sx - px, sz - pz) || 1;
  return {
    t,
    miss: Math.hypot(qx - sx, qz - sz),
    dot: ((sx - px) * dx + (sz - pz) * dz) / dist,
  };
}

function aimRadius(door) {
  return (door.meta.name || "").indexOf("c9643aaf") !== -1 ? 0.52 : 0.34;
}

function doorUseLabel(door) {
  const verb = door.target > 0.5 ? "CLOSE" : "OPEN";
  const name = door.meta.name || "";
  if (name.indexOf("c9643aaf") !== -1) return "E    " + verb + " BATH";
  if (name.indexOf("05f0d57c") !== -1) return "E    " + verb + " BEDROOM";
  return "E    " + verb;
}

function updatePrompt() {
  nearestDoor = null;
  nearestUse = null;
  const fx = -Math.sin(state.yaw);
  const fz = -Math.cos(state.yaw);
  let bestUse = 0.2;
  for (const item of fixtures) {
    if (item.when && !item.when()) continue;
    const dx = item.x - state.x;
    const dz = item.z - state.z;
    const dist = Math.hypot(dx, dz);
    if (dist > item.reach || dist < 0.05) continue;
    const dot = (dx * fx + dz * fz) / dist;
    if (dot < 0.4) continue;
    const score = dot / (dist + 0.2);
    if (score > bestUse) { bestUse = score; nearestUse = item; }
  }
  let bestScore = 0;
  const touching = [];
  const inWasherCloset = state.x > 1.45 && state.x < 2.85 && state.z > -0.62 && state.z < 0.05;
  for (const door of doors) {
    const laundry = (door.meta.name || "").indexOf("1d711765") !== -1;
    if (laundry && inWasherCloset) continue;
    const leaf = doorLeaf(door);
    const hit = rayLeaf(state.x, state.z, fx, fz, leaf);
    const radius = aimRadius(door);
    const maxT = laundry ? 1.2 : 2.2;
    if (hit.t > 0.05 && hit.t < maxT && hit.miss < radius && hit.dot > 0.45) {
      const score = (1 - hit.miss / radius) / (hit.t + 0.3);
      if (score > bestScore) { bestScore = score; nearestDoor = door; }
    }
    const dist = pointOnLeaf(state.x, state.z, leaf);
    if (dist < 0.4) touching.push({ door, dist, dot: hit.dot });
  }
  if (bestScore === 0 && touching.length) {
    touching.sort((a, b) => a.dist - b.dist);
    if (touching.length === 1 || touching[0].dist + 0.14 < touching[1].dist) nearestDoor = touching[0].door;
    else {
      let bestDot = 0.2;
      for (const item of touching) {
        if (item.dot > bestDot) { bestDot = item.dot; nearestDoor = item.door; }
      }
    }
  }
  const el = $("prompt");
  if (!state.started) { el.style.display = "none"; return; }
  if (nearestUse) {
    el.style.display = "block";
    el.textContent = nearestUse.label();
  } else if (nearestDoor) {
    el.style.display = "block";
    el.textContent = doorUseLabel(nearestDoor);
  } else el.style.display = "none";
}

function showScreen(mat, on, tex) {
  if (!mat) return;
  mat.map = on ? tex : null;
  mat.emissiveMap = on ? tex : null;
  mat.color.set(on ? 0xffffff : 0x050608);
  mat.emissive.set(on ? 0xffffff : 0x000000);
  mat.emissiveIntensity = on ? 0.45 : 0;
  mat.metalness = on ? 0.04 : 0;
  mat.roughness = on ? 0.4 : 0.92;
  mat.needsUpdate = true;
}

function setLivingTv(on) {
  state.tv = on;
  if (!on && tvChannels.length) tvChannel = (tvChannel + 1) % tvChannels.length;

function useFocused() {
  if (!state.started) return;
  if (nearestUse) nearestUse.toggle();
  else if (nearestDoor) nearestDoor.target = nearestDoor.target > 0.5 ? 0 : 1;
}

function footstep(dt) {
  if (!audio || !state.started || state.speed < 0.4) { stepClock = 0; return; }
  stepClock += dt;
  const gap = (keys.has("shiftleft") || keys.has("shiftright")) ? 0.28 : 0.42;
  if (stepClock < gap) return;
  stepClock = 0;
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  const filter = audio.createBiquadFilter();
  osc.type = "square";
  osc.frequency.value = 55 + Math.random() * 25;
  filter.type = "lowpass";
  filter.frequency.value = 180;
  gain.gain.setValueAtTime(0.045, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  osc.connect(filter); filter.connect(gain); gain.connect(audio.destination);
  osc.start(t); osc.stop(t + 0.08);
}

function frame(now) {
  const dt = Math.min(0.05, (now - (frame.last || now)) / 1000);
  frame.last = now;
  if (state.started) {
    if (touchLook.x || touchLook.y) {
      state.yaw -= touchLook.x * 2.2 * dt;
      state.pitch -= touchLook.y * 1.7 * dt;
      state.pitch = Math.max(-1.15, Math.min(1.15, state.pitch));
    }
    const forward = new THREE.Vector3(-Math.sin(state.yaw), 0, -Math.cos(state.yaw));
    const right = new THREE.Vector3(Math.cos(state.yaw), 0, -Math.sin(state.yaw));
    let ix = 0, iz = 0;
    if (keys.has("keyw") || keys.has("arrowup")) { ix += forward.x; iz += forward.z; }
    if (keys.has("keys") || keys.has("arrowdown")) { ix -= forward.x; iz -= forward.z; }
    if (keys.has("keyd") || keys.has("arrowright")) { ix += right.x; iz += right.z; }
    if (keys.has("keya") || keys.has("arrowleft")) { ix -= right.x; iz -= right.z; }
    if (touchMove.y) { ix += forward.x * touchMove.y; iz += forward.z * touchMove.y; }
    if (touchMove.x) { ix += right.x * touchMove.x; iz += right.z * touchMove.x; }
    const len = Math.hypot(ix, iz) || 1;
    const running = keys.has("shiftleft") || keys.has("shiftright");
    const vel = (running ? 3.6 : 2.05) * (ix || iz ? 1 : 0);
    state.speed = vel;
    tryMove(state.x + (ix / len) * vel * dt, state.z + (iz / len) * vel * dt);
    bob += vel * dt * 7;
    if (curtainRig) {
      const goal = curtainRig.open ? 1 : 0;
      curtainRig.amount += (goal - curtainRig.amount) * Math.min(1, dt * 3.2);
      curtainRig.mesh.position.z = curtainRig.z0 + (curtainRig.z1 - curtainRig.z0) * curtainRig.amount;
      curtainRig.mesh.scale.x = 1 - curtainRig.amount * 0.35;
    }
    for (const cab of cabinets) {
      const goal = cab.open ? 1 : 0;
      cab.amount += (goal - cab.amount) * Math.min(1, dt * 4);
      cab.group.rotation.y = cab.amount * cab.sign * Math.PI * 0.5;
    }
    for (const drawer of drawers) {
      const goal = drawer.open ? 1 : 0;
      drawer.amount += (goal - drawer.amount) * Math.min(1, dt * 4);
      drawer.group.position.x = drawer.x0 - drawer.amount * 0.28;
    }
    if (fridge) {
      const goal = fridge.open ? 1 : 0;
      fridge.amount += (goal - fridge.amount) * Math.min(1, dt * 4);
      fridge.group.rotation.y = fridge.amount * fridge.sign * Math.PI * 0.5;
    }
    for (const win of windows) {
      const goal = win.open ? 1 : 0;
      win.amount += (goal - win.amount) * Math.min(1, dt * 3);
      win.mesh.position.y = win.y0 + win.amount * 1.55;
    }
    for (const stream of waterStreams) {
      stream.mesh.visible = stream.on;
      if (stream.on) stream.mesh.scale.y = 0.82 + Math.sin(now / 90) * 0.18;
    }
    for (const door of doors) {
      door.amount += (door.target - door.amount) * Math.min(1, dt * 4);
      if (door.meta.motion === "slide") {
        door.group.position.set(
          door.meta.hinge[0] + door.meta.slide[0] * door.amount,
          0,
          door.meta.hinge[1] + door.meta.slide[1] * door.amount
        );
        door.group.rotation.y = 0;
      } else {
        door.group.position.set(door.meta.hinge[0], 0, door.meta.hinge[1]);
        door.group.rotation.y = door.amount * door.sign * Math.PI * 0.5;
      }
    }
    footstep(dt);
    updatePrompt();
  }
  const hop = state.speed > 0.2 ? Math.sin(bob) * 0.035 : 0;
  camera.position.set(state.x, state.y + hop, state.z);
  camera.rotation.order = "YXZ";
  camera.rotation.y = state.yaw;
  camera.rotation.x = state.pitch;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function dressMat(color, opts) {
  const extra = opts || {};
  const mat = new THREE.MeshStandardMaterial(Object.assign({
    color: new THREE.Color(color),
    roughness: extra.roughness == null ? 0.84 : extra.roughness,
    metalness: extra.metalness == null ? 0 : extra.metalness,
    side: THREE.DoubleSide,
  }, extra));
  mat.userData.emissive = new THREE.Color((opts && opts.emissive) || 0x000000);
  mat.emissive = mat.userData.emissive.clone();
  materials.push(mat);
  return mat;
}

function paintTexture(w, h, draw) {
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  draw(canvas.getContext("2d"), w, h);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function carveScan(mesh) {
  const geo = mesh.geometry;
  const pos = geo.getAttribute("position");
  const index = geo.getIndex();
  if (!pos || !index) return;
  const src = index.array;
  const keep = [];
  for (let i = 0; i < src.length; i += 3) {
    const ia = src[i], ib = src[i + 1], ic = src[i + 2];
    const cx = (pos.getX(ia) + pos.getX(ib) + pos.getX(ic)) / 3;
    const cy = (pos.getY(ia) + pos.getY(ib) + pos.getY(ic)) / 3;
    const cz = (pos.getZ(ia) + pos.getZ(ib) + pos.getZ(ic)) / 3;
    let drop = false;
    for (let b = 0; b < CARVE.length; b++) {
      const box = CARVE[b];
      if (cx >= box[0] && cx <= box[3] && cy >= box[1] && cy <= box[4] && cz >= box[2] && cz <= box[5]) {
        drop = true;
        break;
      }
    }
    if (!drop) keep.push(ia, ib, ic);
  }
  if (keep.length !== src.length) geo.setIndex(keep);
}

function addDevices() {
  const plateMat = dressMat(0xf7f4ee, { roughness: 0.45 });
  const rimMat = dressMat(0xd5d0c8, { roughness: 0.7 });
  const ivory = dressMat(0xb7b1a6, { roughness: 0.45 });
  const slotMat = dressMat(0x2a2a2a, { roughness: 0.4 });
  const plateGeo = new THREE.BoxGeometry(0.086, 0.132, 0.012);
  const rimGeo = new THREE.BoxGeometry(0.094, 0.14, 0.004);
  const rockerGeo = new THREE.BoxGeometry(0.026, 0.04, 0.008);
  const outletGeo = new THREE.BoxGeometry(0.03, 0.03, 0.006);
  const slotGeo = new THREE.BoxGeometry(0.011, 0.0035, 0.003);
  const add = (x, y, z, yaw, kind) => {
    const group = new THREE.Group();
    group.position.set(x, y, z);
    group.rotation.y = yaw;
    const rim = new THREE.Mesh(rimGeo, rimMat);
    rim.position.z = -0.004;
    const plate = new THREE.Mesh(plateGeo, plateMat);
    plate.castShadow = false;
    plate.receiveShadow = true;
    group.add(rim, plate);
    if (kind === "switch") {
      const rocker = new THREE.Mesh(rockerGeo, ivory);
      rocker.position.set(0, 0.006, 0.007);
      rocker.rotation.x = -0.18;
      group.add(rocker);
    } else {
      [-0.02, 0.02].forEach((yy) => {
        const face = new THREE.Mesh(outletGeo, ivory);
        face.position.set(0, yy, 0.006);
        group.add(face);
        [-0.005, 0.005].forEach((sx) => {
          const slot = new THREE.Mesh(slotGeo, slotMat);
          slot.position.set(sx, yy + 0.004, 0.01);
          group.add(slot);
        });
        const ground = new THREE.Mesh(slotGeo, slotMat);
        ground.rotation.z = Math.PI / 2;
        ground.position.set(0, yy - 0.006, 0.01);
        group.add(ground);
      });
    }
    scene.add(group);
  };
  // Living room pier between the south windows, the plate in the gallery photo.
  add(-1.02, 1.22, -4.86, 0, "switch");
  add(-1.02, 0.36, -4.86, 0, "outlet");
  // Kitchen backsplash, facing into the kitchen.
  add(-2.83, 1.16, -3.55, Math.PI / 2, "outlet");
  // Bedroom, low outlet under the north windows and a switch by the door.
  add(-1.12, 0.34, 4.74, Math.PI, "outlet");
  add(-0.92, 1.2, 1.1, 0, "switch");
  // Beside the living-room television, facing into the room.
  add(2.77, 0.36, -1.45, -Math.PI / 2, "outlet");
  // Bathroom, on the wall inside the door.
  add(0.22, 1.18, 0.86, Math.PI, "switch");
  add(0.62, 0.36, 0.86, Math.PI, "outlet");
}

function addStairwell() {
  const tex = paintTexture(96, 160, (g, w, h) => {
    g.fillStyle = "#f3f0e8";
    g.fillRect(0, 0, w, h);
    g.fillStyle = "#e4ddd2";
    g.fillRect(0, 0, w, 22);
    g.fillStyle = "#d9d2c6";
    g.fillRect(0, 0, 14, h);
    g.fillRect(w - 14, 0, 14, h);
    for (let i = 0; i < 7; i++) {
      const y = 36 + i * 17;
      const inset = 14 + i * 3;
      g.fillStyle = i % 2 ? "#d8d0c2" : "#c9bfae";
      g.fillRect(inset, y, w - inset * 2, 7);
      g.fillStyle = "#b3a898";
      g.fillRect(inset, y + 7, w - inset * 2, 10);
    }
    g.strokeStyle = "#2a241e";
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(22, 42);
    g.lineTo(40, 148);
    g.stroke();
  });
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  const mat = dressMat(0xffffff, { map: tex, roughness: 1 });
  mat.side = THREE.DoubleSide;
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 2.2), mat);
  plane.position.set(-2.35, 1.15, -1.38);
  plane.rotation.y = Math.PI / 2;
  scene.add(plane);
}

  const texLoader = new THREE.TextureLoader();
  const matByName = {};
  for (const [name, spec] of Object.entries(level.materials)) {
    matByName[name] = makeMaterial(spec, texLoader);
    matByName[name].userData.role = name;
  }
  finishPalette();

  const [minx, minz, maxx, maxz] = level.bounds;
  const ceilGeo = new THREE.PlaneGeometry((maxx - minx) + 1.2, (maxz - minz) + 1.2);
  ceiling = new THREE.Mesh(ceilGeo, new THREE.MeshStandardMaterial({ color: 0x1a120e, roughness: 0.96 }));
  ceiling.receiveShadow = true;
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.set((minx + maxx) / 2, level.ceiling - 0.02, (minz + maxz) / 2);
  scene.add(ceiling);

  let doorCursor = 0;
  for (const rec of level.meshes) {
    const mat = matByName[rec.mat] || matByName.material_1;
    const mesh = buildMesh(bin, rec, mat);
    if (rec.mat === "material_0" || rec.mat === "material_4") mesh.geometry.computeVertexNormals();
    if (rec.door) {
      const meta = level.doors[doorCursor++];
      const group = new THREE.Group();
      mesh.position.set(-meta.hinge[0], 0, -meta.hinge[1]);
      group.add(mesh);
      group.position.set(meta.hinge[0], 0, meta.hinge[1]);
      scene.add(group);
      const door = { meta, group, mesh, amount: 0, target: 0, sign: 1 };
      door.sign = chooseSwing(door);
      doors.push(door);
    } else {
      carveScan(mesh);
      scene.add(mesh);
    }
  }

  dressApartment();
  buildRoomEnv();
  applyLook();
  $("load").classList.add("hide");
  window.GAME = { state, doors, blockedAt, scene, camera, renderer, level };
  requestAnimationFrame(frame);
}

function startAudio() {
  if (audio) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  audio = new Ctx();
  if (audio.state === "suspended") audio.resume();
}

function playWasher() {
  startAudio();
  if (!audio) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  const filter = audio.createBiquadFilter();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(80, t);
  osc.frequency.linearRampToValueAtTime(150, t + 0.35);
  osc.frequency.linearRampToValueAtTime(64, t + 1.5);
  filter.type = "lowpass";
  filter.frequency.value = 420;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.045, t + 0.06);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audio.destination);
  osc.start(t);
  osc.stop(t + 1.65);
  for (let i = 0; i < 4; i++) {
    const thump = audio.createOscillator();
    const thumpGain = audio.createGain();
    const tt = t + 0.12 + i * 0.32;
    thump.type = "square";
    thump.frequency.value = 55;
    thumpGain.gain.setValueAtTime(0.06, tt);
    thumpGain.gain.exponentialRampToValueAtTime(0.0001, tt + 0.07);
    thump.connect(thumpGain);
    thumpGain.connect(audio.destination);
    thump.start(tt);
    thump.stop(tt + 0.08);
  }
}

function beginTour() {
  if (state.started) return;
  state.started = true;
  $("cover").classList.add("hide");
  if (!document.body.classList.contains("touch")) view.requestPointerLock?.();
  startAudio();
}

$("cover").addEventListener("pointerup", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  beginTour();
});
view.addEventListener("click", () => {
  if (!state.started || document.body.classList.contains("touch")) return;
  view.requestPointerLock?.();
});
document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== view) return;
  state.yaw -= e.movementX * 0.0022;
  state.pitch -= e.movementY * 0.002;
  state.pitch = Math.max(-1.15, Math.min(1.15, state.pitch));
});
document.addEventListener("keydown", (e) => {
  const code = e.code.toLowerCase();
  const fresh = !keys.has(code);
  keys.add(code);
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  if (!fresh || !state.started) return;
  if (e.code === "KeyE") useFocused();
});
document.addEventListener("keyup", (e) => keys.delete(e.code.toLowerCase()));

const sticks = { move: null, look: null };

function endStick(which) {
  const stick = sticks[which];
  if (!stick) return;
  stick.el.classList.remove("on");
  stick.el.querySelector(".nub").style.transform = "translate(0px,0px)";
  sticks[which] = null;
  if (which === "move") { touchMove.x = 0; touchMove.y = 0; }
  else { touchLook.x = 0; touchLook.y = 0; }
}

$("touch").addEventListener("pointerdown", (e) => {
  if (!state.started || e.target === $("useBtn")) return;
  const which = e.clientX < window.innerWidth * 0.5 ? "move" : "look";
  if (sticks[which]) return;
  e.preventDefault();
  $("touch").setPointerCapture(e.pointerId);
  const el = $(which === "move" ? "stickMove" : "stickLook");
  el.classList.add("on");
  el.style.left = e.clientX + "px";
  el.style.top = e.clientY + "px";
  sticks[which] = { id: e.pointerId, x: e.clientX, y: e.clientY, el };
});

$("touch").addEventListener("pointermove", (e) => {
  const which = sticks.move && sticks.move.id === e.pointerId ? "move" : sticks.look && sticks.look.id === e.pointerId ? "look" : null;
  if (!which) return;
  e.preventDefault();
  const stick = sticks[which];
  let dx = e.clientX - stick.x;
  let dy = e.clientY - stick.y;
  const max = 46;
  const len = Math.hypot(dx, dy) || 1;
  if (len > max) { dx *= max / len; dy *= max / len; }
  stick.el.querySelector(".nub").style.transform = "translate(" + dx + "px," + dy + "px)";
  if (which === "move") {
    touchMove.x = dx / max;
    touchMove.y = -dy / max;
  } else {
    touchLook.x = dx / max;
    touchLook.y = dy / max;
  }
});

const releaseStick = (e) => {
  if (sticks.move && sticks.move.id === e.pointerId) endStick("move");
  if (sticks.look && sticks.look.id === e.pointerId) endStick("look");
};
$("touch").addEventListener("pointerup", releaseStick);
$("touch").addEventListener("pointercancel", releaseStick);
$("touch").addEventListener("contextmenu", (e) => e.preventDefault());

$("useBtn").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  e.stopPropagation();
  useFocused();
});
$("useBtn").addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("resize", () => { if (renderer) resize(); });

main().catch((err) => {
  $("load").textContent = "COULD NOT OPEN THE FLOOR PLAN";
  console.error(err);
});
</script>
