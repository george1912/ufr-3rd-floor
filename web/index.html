<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Urban Fox Rentals — 3rd Floor</title>
<style>
  :root {
    --ink: #f0ddb8;
    --dim: #b89a72;
    --bar: #24160f;
    --bar-edge: #6b4a2e;
    --hud: 92px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070504; color: var(--ink); }
  body {
    font-family: "Courier New", Courier, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  body.touch { touch-action: none; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0 0 var(--hud) 0; }
  #view { width: 100%; height: 100%; display: block; image-rendering: auto; }
  #cross {
    position: absolute; left: 50%; top: 46%; width: 14px; height: 14px;
    transform: translate(-50%, -50%); pointer-events: none;
  }
  #cross::before, #cross::after {
    content: ""; position: absolute; background: rgba(240, 221, 184, 0.85);
  }
  #cross::before { left: 6px; top: 0; width: 2px; height: 14px; }
  #cross::after { left: 0; top: 6px; width: 14px; height: 2px; }
  #prompt {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    letter-spacing: 0.18em; font-size: 13px; color: var(--ink);
    text-shadow: 0 2px 0 #000; display: none;
  }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--hud);
    background: linear-gradient(#3a2418, var(--bar));
    border-top: 3px solid var(--bar-edge);
    display: grid; grid-template-columns: 92px 1fr auto; align-items: center;
    padding: 0 16px 0 10px; gap: 12px;
  }
  #face { width: 64px; height: 64px; display: block; }
  #titles { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  #titles b { font-size: 15px; letter-spacing: 0.14em; font-weight: 700; }
  #titles span { color: var(--dim); font-size: 12px; letter-spacing: 0.08em; }
  #hint {
    display: flex; align-items: center; justify-content: flex-end; gap: 14px;
    color: var(--dim); font-size: 11px; letter-spacing: 0.1em;
  }
  .wasd { display: grid; grid-template-columns: repeat(3, 18px); grid-template-rows: 18px 18px; gap: 3px; }
  .wasd kbd:nth-child(1) { grid-column: 2; grid-row: 1; }
  .wasd kbd:nth-child(2) { grid-column: 1; grid-row: 2; }
  .wasd kbd:nth-child(3) { grid-column: 2; grid-row: 2; }
  .wasd kbd:nth-child(4) { grid-column: 3; grid-row: 2; }
  .hintbit { flex: 0 0 auto; }
  kbd {
    display: grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px;
    border: 1px solid rgba(240, 221, 184, 0.45); border-bottom-width: 2px; border-radius: 4px;
    color: var(--ink); font: inherit; font-size: 10px; letter-spacing: 0;
    background: rgba(255, 255, 255, 0.05);
  }
  .hintbit { white-space: nowrap; }
  #cover {
    position: fixed; inset: 0; background: rgba(5, 3, 2, 0.78);
    display: flex; align-items: center; justify-content: center; text-align: center;
    z-index: 5; cursor: pointer;
  }
  #cover.hide { display: none; }
  #cover h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: 0.22em; font-weight: 700; }
  #cover h2 { margin: 0 0 28px; font-weight: 400; letter-spacing: 0.42em; color: var(--dim); font-size: 13px; }
  #cover p { margin: 0; letter-spacing: 0.28em; font-size: 14px; }
  #cover ul {
    list-style: none; padding: 22px 0 0; margin: 0; color: var(--dim);
    letter-spacing: 0.12em; line-height: 1.7; font-size: 12px;
  }
  #load {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #070504; z-index: 6; letter-spacing: 0.28em; font-size: 13px;
  }
  #load.hide { display: none; }
  #touch {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: var(--hud);
    height: 250px;
    z-index: 4;
    pointer-events: none;
    touch-action: none;
  }
  body.touch #touch { display: block; }
  #dpad, #lookstick, #useBtn {
    position: absolute;
    pointer-events: auto;
    touch-action: none;
    -webkit-touch-callout: none;
  }
  #dpad {
    left: max(16px, env(safe-area-inset-left));
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 168px; height: 168px;
    border-radius: 28px;
    background: rgba(18, 12, 9, 0.42);
    border: 1px solid rgba(184, 154, 114, 0.4);
  }
  #dpad .dir {
    position: absolute;
    width: 64px; height: 64px;
    display: grid; place-items: center;
    pointer-events: none;
    color: rgba(240, 221, 184, 0.82);
    font-size: 20px; line-height: 1;
  }
  #dpad .up { left: 52px; top: 6px; }
  #dpad .down { left: 52px; bottom: 6px; }
  #dpad .left { left: 6px; top: 52px; }
  #dpad .right { right: 6px; top: 52px; }
  #dpad .dir.on {
    background: rgba(240, 221, 184, 0.16);
    border-radius: 14px;
  }
  #lookstick {
    right: max(16px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 140px; height: 140px;
    border-radius: 50%;
    background: rgba(18, 12, 9, 0.42);
    border: 1px solid rgba(184, 154, 114, 0.4);
    display: grid; place-items: center;
  }
  #lookstick .nub {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(240, 221, 184, 0.22);
    border: 1px solid rgba(240, 221, 184, 0.5);
    pointer-events: none;
  }
  #useBtn {
    right: max(48px, calc(env(safe-area-inset-right) + 32px));
    bottom: 168px;
    min-width: 76px; min-height: 64px;
    padding: 0 14px;
    font: inherit; letter-spacing: 0.16em; font-size: 13px;
    color: var(--ink);
    background: rgba(18, 12, 9, 0.55);
    border: 1px solid rgba(184, 154, 114, 0.55);
    border-radius: 16px;
  }
  @media (max-width: 640px) {
    #cover h1 { font-size: 18px; }
  }
  /* Phone: a short label, with the controls in the bottom corners of the view. */
  body.touch { --hud: calc(40px + env(safe-area-inset-bottom)); }
  body.touch #hud {
    grid-template-columns: 40px 1fr;
    padding: 0 12px 0 8px;
    gap: 8px;
  }
  body.touch #hint { display: none; }
  body.touch #face { width: 32px; height: 32px; }
  body.touch #titles b { font-size: 11px; letter-spacing: 0.08em; }
  body.touch #titles span { font-size: 10px; letter-spacing: 0.06em; }
  body.touch #touch { height: 156px; }
  body.touch #dpad {
    width: 108px; height: 108px;
    border-radius: 18px;
    bottom: 6px;
  }
  body.touch #dpad .dir { width: 42px; height: 42px; font-size: 14px; }
  body.touch #dpad .up { left: 33px; top: 2px; }
  body.touch #dpad .down { left: 33px; bottom: 2px; }
  body.touch #dpad .left { left: 2px; top: 33px; }
  body.touch #dpad .right { right: 2px; top: 33px; }
  body.touch #lookstick { width: 96px; height: 96px; bottom: 6px; }
  body.touch #lookstick .nub { width: 40px; height: 40px; }
  body.touch #useBtn {
    right: max(22px, calc(env(safe-area-inset-right) + 14px));
    bottom: 108px;
    min-width: 58px; min-height: 40px;
    padding: 0 10px;
    font-size: 11px;
    border-radius: 12px;
  }
</style>
</head>
<body>
<div id="load">READING THE FLOOR PLAN</div>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="cross"></div>
  <div id="prompt">E &nbsp; OPEN</div>
</div>
<footer id="hud">
  <svg id="face" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="8" fill="#1c120c"/>
    <path fill="#e08a3c" d="M15 29 7 4.5 29 18.5Z"/>
    <path fill="#f6d3ae" d="M16.2 26.2 11.2 9.2 25.4 18.4Z"/>
    <path fill="#e08a3c" d="M49 29 57 4.5 35 18.5Z"/>
    <path fill="#f6d3ae" d="M47.8 26.2 52.8 9.2 38.6 18.4Z"/>
    <path fill="#e08a3c" d="M32 17.5c-13.2 0-21.4 8.6-21.4 19.4C10.6 49.2 19 58.8 32 61.2 45 58.8 53.4 49.2 53.4 36.9c0-10.8-8.2-19.4-21.4-19.4Z"/>
    <path fill="#c56a28" d="M14.2 35.2C16 28.2 22.2 23.6 32 23.6s16 4.6 17.8 11.6c-3.4-2.6-9.2-4-17.8-4s-14.4 1.4-17.8 4Z"/>
    <path fill="#f8e4cc" d="M32 39.6c-8 0-12.6 4.4-13.6 10.2-.7 4.2 1.6 8.4 7 10.4 2 .8 4.2 1.2 6.6 1.2s4.6-.4 6.6-1.2c5.4-2 7.7-6.2 7-10.4-1-5.8-5.6-10.2-13.6-10.2Z"/>
    <g fill="#1a120e">
      <ellipse cx="23.4" cy="35.4" rx="3.15" ry="3.85" transform="rotate(-14 23.4 35.4)"/>
      <ellipse cx="40.6" cy="35.4" rx="3.15" ry="3.85" transform="rotate(14 40.6 35.4)"/>
    </g>
    <g fill="#fff8ef">
      <circle cx="24.45" cy="34.15" r="1"/>

    <path fill="none" stroke="#2a1810" stroke-width="1.2" stroke-linecap="round" d="M32 52.8v3.4M32 56c-1.8 1.6-4 1.8-5.6.2M32 56c1.8 1.6 4 1.8 5.6.2"/>
  </svg>
  <div id="titles">
    <b>URBAN FOX RENTALS</b>
    <span>3RD FLOOR &nbsp;·&nbsp; EXPLORE THE SPACE</span>
  </div>
  <div id="hint">
    <div class="wasd" aria-label="W A S D to move">
      <kbd>W</kbd>
      <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>

    <span class="hintbit">MOVE</span>

    <span class="hintbit">HOLD <kbd>SHIFT</kbd> RUN</span>
  </div>
</footer>
<div id="cover">
  <div>
    <h1>URBAN FOX RENTALS</h1>
    <h2>3RD FLOOR</h2>
    <p id="startHint">CLICK TO EXPLORE</p>
    <ul id="startKeys">
      <li>WASD MOVE &nbsp;·&nbsp; MOUSE LOOK</li>
      <li>E USE &nbsp;·&nbsp; HOLD SHIFT TO RUN</li>
    </ul>
  </div>
</div>
<div id="touch">
  <div id="dpad" aria-label="Move">
    <span class="dir up">▲</span>
    <span class="dir left">◀</span>
    <span class="dir right">▶</span>
    <span class="dir down">▼</span>
  </div>
  <div id="lookstick" aria-label="Look">
    <div class="nub"></div>
  </div>
  <button id="useBtn" type="button">USE</button>
</div>
<script src="vendor/three.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const view = $("view");
const keys = new Set();
const state = {
  started: false,
  tv: false,
  yaw: 0.4,
  pitch: 0,
  x: 0, y: 1.65, z: 0,
  speed: 0,
};
const touchMove = { x: 0, y: 0 };
const touchLook = { x: 0, y: 0 };
const finePointer = window.matchMedia("(pointer: fine)").matches;
const touchPreferred = window.matchMedia("(pointer: coarse)").matches && !finePointer;
if (touchPreferred) {
  document.body.classList.add("touch");
  $("startHint").textContent = "TAP TO EXPLORE";
  $("startKeys").innerHTML = "<li>MOVE &nbsp;·&nbsp; LOOK &nbsp;·&nbsp; USE</li>";
}

let level, blocked, inside, doorOwner;
let doors = [];
let renderer, scene, camera, ambient, hemi, ceiling, sun, roomEnv;
let cans = [];
let materials = [];
let audio, stepClock = 0, bob = 0;
let nearestDoor = null;
let nearestUse = null;
const fixtures = [];
let tvMat = null;
let curtainRig = null;
let cabinets = [];
let waterStreams = [];

function hexBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}

function cellIndex(x, z) {
  const c = Math.floor((x - level.origin[0]) / level.cell);
  const r = Math.floor((z - level.origin[1]) / level.cell);
  if (c < 0 || r < 0 || c >= level.gridW || r >= level.gridH) return -1;
  return r * level.gridW + c;
}

function blockedAt(x, z) {
  const i = cellIndex(x, z);
  if (i < 0 || !inside[i]) return true;
  const b = blocked[i];
  if (b === 0 || b === undefined) return false;
  if (b === 3) {
    const id = doorOwner[i] - 1;
    const door = doors[id];
    return !door || door.amount < 0.72;
  }
  return true;
}

function releaseDoor(ownerId, fill) {
  const W = level.gridW;
  for (let i = 0; i < doorOwner.length; i++) {
    if (doorOwner[i] !== ownerId) continue;
    const z = level.origin[1] + (Math.floor(i / W) + 0.5) * level.cell;
    doorOwner[i] = 0;
    if (blocked[i] === 3) blocked[i] = fill(z);
  }
}

function stampDoor(ownerId, x0, z0, x1, z1) {
  const cell = level.cell;
  const c0 = Math.floor((Math.min(x0, x1) - level.origin[0]) / cell);
  const c1 = Math.floor((Math.max(x0, x1) - level.origin[0]) / cell);
  const r0 = Math.floor((Math.min(z0, z1) - level.origin[1]) / cell);
  const r1 = Math.floor((Math.max(z0, z1) - level.origin[1]) / cell);
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      if (c < 0 || r < 0 || c >= level.gridW || r >= level.gridH) continue;
      const i = r * level.gridW + c;
      if (!inside[i] || blocked[i] === 1) continue;
      blocked[i] = 3;
      doorOwner[i] = ownerId;
    }
  }
}

function widenWalk() {
  const openProp = (x0, z0, x1, z1) => {
    const c0 = Math.floor((Math.min(x0, x1) - level.origin[0]) / level.cell);
    const c1 = Math.floor((Math.max(x0, x1) - level.origin[0]) / level.cell);
    const r0 = Math.floor((Math.min(z0, z1) - level.origin[1]) / level.cell);
    const r1 = Math.floor((Math.max(z0, z1) - level.origin[1]) / level.cell);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (c < 0 || r < 0 || c >= level.gridW || r >= level.gridH) continue;
        const i = r * level.gridW + c;
        if (blocked[i] === 2) blocked[i] = 0;
      }
    }
  };
  openProp(0.42, -3.05, 0.78, -1.28);
  openProp(1.22, -2.9, 1.62, -1.2);
  openProp(1.45, -1.2, 2.55, -0.5);
}

function peelWallSkin() {
  const W = level.gridW;
  const H = level.gridH;
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const core = (c, r) => {
    if (c < 0 || r < 0 || c >= W || r >= H || blocked[r * W + c] !== 1) return false;
    for (let i = 0; i < 4; i++) {
      const cc = c + dirs[i][0];
      const rr = r + dirs[i][1];
      if (cc < 0 || rr < 0 || cc >= W || rr >= H || blocked[rr * W + cc] !== 1) return false;
    }
    return true;
  };
  const kill = [];
  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const i = r * W + c;
      if (blocked[i] !== 1 || !inside[i]) continue;
      let exposed = false;
      let backed = false;
      for (let k = 0; k < 4; k++) {
        const cc = c + dirs[k][0];
        const rr = r + dirs[k][1];
        if (cc < 0 || rr < 0 || cc >= W || rr >= H) { exposed = true; continue; }
        if (blocked[rr * W + cc] !== 1) exposed = true;
        if (core(cc, rr)) backed = true;
      }
      if (exposed && backed) kill.push(i);
    }
  }
  kill.forEach((i) => { blocked[i] = 0; });
}

function tryMove(nx, nz) {
  const r = 0.02;
  const hits = (x, z) => blockedAt(x, z) || blockedAt(x + r, z) || blockedAt(x - r, z) || blockedAt(x, z + r) || blockedAt(x, z - r);
  if (!hits(nx, state.z)) state.x = nx;
  if (!hits(state.x, nz)) state.z = nz;
}

function makeMaterial(spec, texLoader) {
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(spec.color || "#cccccc"),
    roughness: 0.86,
    metalness: 0,
    side: THREE.DoubleSide,
  });
  mat.userData.role = spec.role || "";
  mat.userData.emissive = new THREE.Color(spec.emissive || "#000000");
  mat.emissive = mat.userData.emissive.clone();
  if (spec.opacity != null && spec.opacity < 1) {
    mat.transparent = true;
    mat.opacity = spec.opacity;
  }
  if (spec.map) {
    const tex = texLoader.load(spec.map);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    if (spec.repeat) tex.repeat.set(spec.repeat[0], spec.repeat[1]);
    if (spec.rough) tex.magFilter = THREE.NearestFilter;
    mat.map = tex;
  }
  materials.push(mat);
  return mat;
}

function buildMesh(bin, rec, mat) {
  const pos = new Float32Array(bin, rec.pos, rec.posCount * 3);
  const nrm = new Float32Array(bin, rec.nrm, rec.posCount * 3);
  const uv = new Float32Array(bin, rec.uv, rec.posCount * 2);
  const idx = new Uint32Array(bin, rec.idx, rec.idxCount);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("normal", new THREE.BufferAttribute(nrm, 3));
  geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function chooseSwing(door) {
  const [x0, z0, x1, z1] = door.meta.aabb;
  const dx = (x0 + x1) / 2 - door.meta.hinge[0];
  const dz = (z0 + z1) / 2 - door.meta.hinge[1];
  const score = (sign) => {
    const ox = sign > 0 ? -dz : dz;
    const oz = sign > 0 ? dx : -dx;
    return blockedAt(door.meta.hinge[0] + ox, door.meta.hinge[1] + oz) ? 0 : 1;
  };
  // Door cells still read as blocked while shut, so test the swung pose against walls only.
  const wallAt = (x, z) => {
    const i = cellIndex(x, z);
    return i < 0 || !inside[i] || blocked[i] === 1 || blocked[i] === 2;
  };
  const free = (sign) => {
    const ox = sign > 0 ? -dz : dz;
    const oz = sign > 0 ? dx : -dx;
    return wallAt(door.meta.hinge[0] + ox, door.meta.hinge[1] + oz) ? 0 : 1;
  };
  return free(1) >= free(-1) ? 1 : -1;
}

function oakPlanks() {
  const tex = paintTexture(1024, 1024, (g, w, h) => {
    const tones = ["#e4c39a", "#d7b184", "#c9a06e", "#edd4b2", "#c9a474", "#f0dcc0", "#d2a97a", "#e8cba6"];
    const rows = 10;
    const ph = h / rows;
    g.fillStyle = "#c4a078";
    g.fillRect(0, 0, w, h);
    for (let i = 0; i < rows; i++) {
      const y = i * ph;
      const boards = 2 + (i % 3 === 0 ? 1 : 0);
      let x = ((i * 173) % 220) - 80;
      for (let b = 0; b < boards + 2; b++) {
        const bw = w * (0.42 + ((i * 5 + b * 3) % 5) * 0.08);
        g.fillStyle = tones[(i + b) % tones.length];
        g.fillRect(x, y + 1, bw, ph - 2);
        g.strokeStyle = "rgba(92, 58, 28, 0.16)";
        g.lineWidth = 1;
        for (let k = 0; k < 4; k++) {
          const gy = y + 8 + ((k * 19 + i * 11 + b * 7) % (ph - 16));
          g.beginPath();
          g.moveTo(x + 8, gy);
          g.bezierCurveTo(x + bw * 0.3, gy + 3, x + bw * 0.65, gy - 2, x + bw - 10, gy + 1);
          g.stroke();
        }
        g.fillStyle = "rgba(110, 68, 28, 0.14)";
        g.beginPath();
        g.ellipse(x + bw * 0.45, y + ph * 0.55, 7, 4, 0.4, 0, Math.PI * 2);
        g.fill();
        x += bw;
      }
    }
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 10);
  tex.anisotropy = 16;
  return tex;
}

function wallPaint() {
  const tex = paintTexture(256, 256, (g, w, h) => {
    const img = g.createImageData(w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = 244 + Math.random() * 11;
      img.data[i] = n;
      img.data[i + 1] = n - 1;
      img.data[i + 2] = n - 3;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 6);
  tex.anisotropy = 8;
  return tex;
}

function buildRoomEnv() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  env.add(new THREE.HemisphereLight(0xfff8f2, 0xd7b48a, 1.4));
  const key = new THREE.DirectionalLight(0xffffff, 4);
  key.position.set(2, 6, 1);

function doorLeaf(door) {
  const [x0, z0, x1, z1] = door.meta.aabb;
  const hx = door.meta.hinge[0];
  const hz = door.meta.hinge[1];
  const alongX = Math.abs(x1 - x0) >= Math.abs(z1 - z0);
  const slide = door.meta.motion === "slide";
  if (slide) {
    const ox = door.meta.slide[0] * door.amount;
    const oz = door.meta.slide[1] * door.amount;
    if (alongX) return { xA: x0 + ox, zA: (z0 + z1) / 2 + oz, xB: x1 + ox, zB: (z0 + z1) / 2 + oz };
    return { xA: (x0 + x1) / 2 + ox, zA: z0 + oz, xB: (x0 + x1) / 2 + ox, zB: z1 + oz };
  }
  const span = alongX ? ((x0 + x1) / 2 - hx) * 2 : ((z0 + z1) / 2 - hz) * 2;
  const lx = alongX ? span : 0;
  const lz = alongX ? 0 : span;
  const ang = door.amount * door.sign * Math.PI * 0.5;
  const c = Math.cos(ang);
  const s = Math.sin(ang);
  return { xA: hx, zA: hz, xB: hx + lx * c + lz * s, zB: hz - lx * s + lz * c };
}

function pointOnLeaf(px, pz, leaf) {
  const vx = leaf.xB - leaf.xA;
  const vz = leaf.zB - leaf.zA;
  const len2 = vx * vx + vz * vz || 1;
  let u = ((px - leaf.xA) * vx + (pz - leaf.zA) * vz) / len2;
  u = Math.max(0, Math.min(1, u));
  const sx = leaf.xA + u * vx;
  const sz = leaf.zA + u * vz;
  return Math.hypot(px - sx, pz - sz);
}

function rayLeaf(px, pz, dx, dz, leaf) {
  const vx = leaf.xB - leaf.xA;
  const vz = leaf.zB - leaf.zA;
  const wx = px - leaf.xA;
  const wz = pz - leaf.zA;
  const b = dx * vx + dz * vz;
  const c = vx * vx + vz * vz;
  const d = dx * wx + dz * wz;
  const e = vx * wx + vz * wz;
  const denom = c - b * b;
  let t;
  let u;
  if (c < 1e-8) {
    t = Math.max(0, -d);
    u = 0;
  } else if (Math.abs(denom) < 1e-6) {
    u = Math.max(0, Math.min(1, e / c));
    t = (leaf.xA + u * vx - px) * dx + (leaf.zA + u * vz - pz) * dz;
    if (t < 0) t = 0;
  } else {
    t = (b * e - c * d) / denom;
    u = (e - b * d) / denom;
    if (u < 0 || u > 1 || t < 0) {
      u = Math.max(0, Math.min(1, u));
      t = (leaf.xA + u * vx - px) * dx + (leaf.zA + u * vz - pz) * dz;
      if (t < 0) {
        t = 0;
        u = Math.max(0, Math.min(1, e / c));
      }
    }
  }
  const qx = px + t * dx;
  const qz = pz + t * dz;
  const sx = leaf.xA + u * vx;
  const sz = leaf.zA + u * vz;
  const dist = Math.hypot(sx - px, sz - pz) || 1;
  return {
    t,
    miss: Math.hypot(qx - sx, qz - sz),
    dot: ((sx - px) * dx + (sz - pz) * dz) / dist,
  };
}

function aimRadius(door) {
  return (door.meta.name || "").indexOf("c9643aaf") !== -1 ? 0.52 : 0.34;
}

function doorUseLabel(door) {
  const verb = door.target > 0.5 ? "CLOSE" : "OPEN";
  const name = door.meta.name || "";
  if (name.indexOf("c9643aaf") !== -1) return "E    " + verb + " BATH";
  if (name.indexOf("05f0d57c") !== -1) return "E    " + verb + " BEDROOM";
  return "E    " + verb;
}

function updatePrompt() {
  nearestDoor = null;
  nearestUse = null;
  const fx = -Math.sin(state.yaw);
  const fz = -Math.cos(state.yaw);
  let bestUse = 0.2;
  for (const item of fixtures) {
    const dx = item.x - state.x;
    const dz = item.z - state.z;
    const dist = Math.hypot(dx, dz);
    if (dist > item.reach || dist < 0.05) continue;
    const dot = (dx * fx + dz * fz) / dist;
    if (dot < 0.4) continue;
    const score = dot / (dist + 0.2);
    if (score > bestUse) { bestUse = score; nearestUse = item; }
  }
  let bestScore = 0;
  const touching = [];
  for (const door of doors) {
    const leaf = doorLeaf(door);
    const hit = rayLeaf(state.x, state.z, fx, fz, leaf);
    const radius = aimRadius(door);
    if (hit.t > 0.05 && hit.t < 2.2 && hit.miss < radius && hit.dot > 0.45) {
      const score = (1 - hit.miss / radius) / (hit.t + 0.3);
      if (score > bestScore) { bestScore = score; nearestDoor = door; }
    }
    const dist = pointOnLeaf(state.x, state.z, leaf);
    if (dist < 0.4) touching.push({ door, dist, dot: hit.dot });
  }
  if (bestScore === 0 && touching.length) {
    touching.sort((a, b) => a.dist - b.dist);
    if (touching.length === 1 || touching[0].dist + 0.14 < touching[1].dist) nearestDoor = touching[0].door;
    else {
      let bestDot = 0.2;
      for (const item of touching) {
        if (item.dot > bestDot) { bestDot = item.dot; nearestDoor = item.door; }
      }
    }
  }
  const el = $("prompt");
  if (!state.started) { el.style.display = "none"; return; }
  if (nearestUse) {
    el.style.display = "block";
    el.textContent = nearestUse.label();
  } else if (nearestDoor) {
    el.style.display = "block";
    el.textContent = doorUseLabel(nearestDoor);
  } else el.style.display = "none";
}

function useFocused() {
  if (!state.started) return;
  if (nearestUse) nearestUse.toggle();
  else if (nearestDoor) nearestDoor.target = nearestDoor.target > 0.5 ? 0 : 1;
}

function footstep(dt) {
  if (!audio || !state.started || state.speed < 0.4) { stepClock = 0; return; }
  stepClock += dt;
  const gap = (keys.has("shiftleft") || keys.has("shiftright")) ? 0.28 : 0.42;
  if (stepClock < gap) return;
  stepClock = 0;
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  const filter = audio.createBiquadFilter();
  osc.type = "square";
  osc.frequency.value = 55 + Math.random() * 25;
  filter.type = "lowpass";
  filter.frequency.value = 180;
  gain.gain.setValueAtTime(0.045, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  osc.connect(filter); filter.connect(gain); gain.connect(audio.destination);
  osc.start(t); osc.stop(t + 0.08);
}

function frame(now) {
  const dt = Math.min(0.05, (now - (frame.last || now)) / 1000);
  frame.last = now;
  if (state.started) {
    if (touchLook.x || touchLook.y) {
      state.yaw -= touchLook.x * 2.2 * dt;
      state.pitch -= touchLook.y * 1.7 * dt;
      state.pitch = Math.max(-1.15, Math.min(1.15, state.pitch));
    }
    const forward = new THREE.Vector3(-Math.sin(state.yaw), 0, -Math.cos(state.yaw));
    const right = new THREE.Vector3(Math.cos(state.yaw), 0, -Math.sin(state.yaw));
    let ix = 0, iz = 0;
    if (keys.has("keyw") || keys.has("arrowup")) { ix += forward.x; iz += forward.z; }
    if (keys.has("keys") || keys.has("arrowdown")) { ix -= forward.x; iz -= forward.z; }
    if (keys.has("keyd") || keys.has("arrowright")) { ix += right.x; iz += right.z; }
    if (keys.has("keya") || keys.has("arrowleft")) { ix -= right.x; iz -= right.z; }
    if (touchMove.y) { ix += forward.x * touchMove.y; iz += forward.z * touchMove.y; }
    if (touchMove.x) { ix += right.x * touchMove.x; iz += right.z * touchMove.x; }
    const len = Math.hypot(ix, iz) || 1;
    const running = keys.has("shiftleft") || keys.has("shiftright");
    const vel = (running ? 3.6 : 2.05) * (ix || iz ? 1 : 0);
    state.speed = vel;
    tryMove(state.x + (ix / len) * vel * dt, state.z + (iz / len) * vel * dt);
    bob += vel * dt * 7;
    if (curtainRig) {
      const goal = curtainRig.open ? 1 : 0;
      curtainRig.amount += (goal - curtainRig.amount) * Math.min(1, dt * 3.2);
      curtainRig.mesh.position.z = curtainRig.z0 + (curtainRig.z1 - curtainRig.z0) * curtainRig.amount;
      curtainRig.mesh.scale.x = 1 - curtainRig.amount * 0.35;
    }
    for (const cab of cabinets) {
      const goal = cab.open ? 1 : 0;
      cab.amount += (goal - cab.amount) * Math.min(1, dt * 4);
      cab.group.rotation.y = cab.amount * cab.sign * Math.PI * 0.5;
    }
    for (const stream of waterStreams) {
      stream.mesh.visible = stream.on;
      if (stream.on) stream.mesh.scale.y = 0.82 + Math.sin(now / 90) * 0.18;
    }
    for (const door of doors) {
      door.amount += (door.target - door.amount) * Math.min(1, dt * 4);
      if (door.meta.motion === "slide") {
        door.group.position.set(
          door.meta.hinge[0] + door.meta.slide[0] * door.amount,
          0,
          door.meta.hinge[1] + door.meta.slide[1] * door.amount
        );
        door.group.rotation.y = 0;
      } else {
        door.group.position.set(door.meta.hinge[0], 0, door.meta.hinge[1]);
        door.group.rotation.y = door.amount * door.sign * Math.PI * 0.5;
      }
    }
    footstep(dt);
    updatePrompt();
  }
  const hop = state.speed > 0.2 ? Math.sin(bob) * 0.035 : 0;
  camera.position.set(state.x, state.y + hop, state.z);
  camera.rotation.order = "YXZ";
  camera.rotation.y = state.yaw;
  camera.rotation.x = state.pitch;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function dressMat(color, opts) {

    metalness: extra.metalness == null ? 0 : extra.metalness,
    side: THREE.DoubleSide,
  }, extra));
  mat.userData.emissive = new THREE.Color((opts && opts.emissive) || 0x000000);
  mat.emissive = mat.userData.emissive.clone();
  materials.push(mat);
  return mat;
}

// dropped so the beige blocks don't show through the new furniture.

  [0.95, 0.05, -4.1, 1.85, 1.05, -3.1],

];

function carveScan(mesh) {
  const geo = mesh.geometry;
  const pos = geo.getAttribute("position");
  const index = geo.getIndex();
  if (!pos || !index) return;
  const src = index.array;
  const keep = [];
  for (let i = 0; i < src.length; i += 3) {
    const ia = src[i], ib = src[i + 1], ic = src[i + 2];
    const cx = (pos.getX(ia) + pos.getX(ib) + pos.getX(ic)) / 3;
    const cy = (pos.getY(ia) + pos.getY(ib) + pos.getY(ic)) / 3;
    const cz = (pos.getZ(ia) + pos.getZ(ib) + pos.getZ(ic)) / 3;
    let drop = false;
    for (let b = 0; b < CARVE.length; b++) {
      const box = CARVE[b];
      if (cx >= box[0] && cx <= box[3] && cy >= box[1] && cy <= box[4] && cz >= box[2] && cz <= box[5]) {
        drop = true;
        break;
      }
    }
    if (!drop) keep.push(ia, ib, ic);
  }
  if (keep.length !== src.length) geo.setIndex(keep);
}

function addBaseboards() {
  const cell = level.cell;
  const W = level.gridW;
  const H = level.gridH;
  const ox = level.origin[0];
  const oz = level.origin[1];
  const pieces = [];
  const height = 0.09;
  const thick = 0.016;
  const face = cell * 1.04;
  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const i = r * W + c;
      if (!inside[i] || blocked[i] === 1 || blocked[i] === 3) continue;
      const x = ox + (c + 0.5) * cell;
      const z = oz + (r + 0.5) * cell;
      const wall = (dc, dr) => {
        const cc = c + dc;
        const rr = r + dr;
        if (cc < 0 || rr < 0 || cc >= W || rr >= H) return false;
        return blocked[rr * W + cc] === 1;
      };
      if (wall(1, 0)) pieces.push([x + cell / 2 - thick / 2, height / 2, z, thick, height, face]);
      if (wall(-1, 0)) pieces.push([x - cell / 2 + thick / 2, height / 2, z, thick, height, face]);
      if (wall(0, 1)) pieces.push([x, height / 2, z + cell / 2 - thick / 2, face, height, thick]);
      if (wall(0, -1)) pieces.push([x, height / 2, z - cell / 2 + thick / 2, face, height, thick]);
    }
  }
  if (!pieces.length) return;
  const mat = dressMat(0xf6f3ee, { roughness: 0.62 });
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), mat, pieces.length);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  const dummy = new THREE.Object3D();
  pieces.forEach((p, n) => {
    dummy.position.set(p[0], p[1], p[2]);
    dummy.scale.set(p[3], p[4], p[5]);
    dummy.updateMatrix();
    mesh.setMatrixAt(n, dummy.matrix);
  });
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
}

function addDevices() {

          group.add(slot);
        });
        const ground = new THREE.Mesh(slotGeo, slotMat);
        ground.rotation.z = Math.PI / 2;
        ground.position.set(0, yy - 0.006, 0.01);
        group.add(ground);
      });
    }
    scene.add(group);
  };
  // Living room pier between the south windows, the plate in the gallery photo.

  add(-0.92, 1.2, 1.1, 0, "switch");
  // Beside the living-room television, facing into the room.
  add(2.77, 0.36, -1.45, -Math.PI / 2, "outlet");
  // Bathroom, on the wall inside the door.

}

function dressApartment() {

  const orange = dressMat(0xc4622d);

      label: () => cab.open ? "E    CLOSE" : "E    CABINET",
      toggle: () => { cab.open = !cab.open; },
    });
  });
  waterStreams = waters;

  for (const door of doors) {
    const name = door.meta.name;
    const bathDoor = name.indexOf("c9643aaf") !== -1;
    const bedDoor = name.indexOf("05f0d57c") !== -1;
    const ownerId = doors.indexOf(door) + 1;
    if (bathDoor) {
      door.mesh.visible = false;
      door.meta.hinge = [-1.15, 0.82];
      door.meta.aabb = [-1.19, 0.08, -1.11, 0.82];
      releaseDoor(ownerId, () => 1);
      stampDoor(ownerId, -1.28, 0.08, -1.02, 0.82);
    } else if (bedDoor) {
      door.mesh.visible = false;
      door.meta.hinge = [-1.18, 1.26];
      door.meta.aabb = [-1.9, 1.22, -1.18, 1.3];
      releaseDoor(ownerId, (z) => (z > 0.84 ? 1 : 0));
      stampDoor(ownerId, -1.9, 1.18, -1.2, 1.34);
    }
    const [x0, z0, x1, z1] = door.meta.aabb;
    const hx = door.meta.hinge[0];
    const hz = door.meta.hinge[1];
    const dx = Math.abs(x1 - x0);
    const dz = Math.abs(z1 - z0);
    const alongX = dx >= dz;
    const widen = door.meta.motion === "slide" ? 1.16 : bathDoor || bedDoor ? 1 : 1.48;
    if (alongX) door.mesh.scale.x = widen;
    else door.mesh.scale.z = widen;
    const cx = hx + ((x0 + x1) / 2 - hx) * (alongX ? widen : 1);
    const cz = hz + ((z0 + z1) / 2 - hz) * (alongX ? 1 : widen);
    const sx = alongX ? dx * widen : Math.max(dx, 0.055);
    const sz = alongX ? Math.max(dz, 0.055) : dz * widen;
    const slab = name.indexOf("27e5a30b") !== -1 ? pine : white;
    onDoor(door, cx, 1.06, cz, sx * 0.98, 2.06, sz, slab);
    if (slab === pine) {
      onDoor(door, cx, 0.68, cz, sx * 0.55, 0.62, 0.02, pineDark);
      onDoor(door, cx, 1.55, cz, sx * 0.55, 0.52, 0.02, pineDark);
    } else if (name.indexOf("1d711765") !== -1) {
      for (let i = 0; i < 8; i++) onDoor(door, cx, 0.28 + i * 0.24, cz, sx * 0.9, 0.012, sz + 0.02, charcoal);
    } else if (door.meta.motion !== "slide") {
      onDoor(door, cx, 0.62, cz, alongX ? sx * 0.62 : 0.02, 0.7, alongX ? 0.02 : sz * 0.62, grey);
      onDoor(door, cx, 1.5, cz, alongX ? sx * 0.62 : 0.02, 0.55, alongX ? 0.02 : sz * 0.62, grey);
    }
    const hingeAlong = alongX ? hx : hz;
    const a0 = alongX ? x0 : z0;
    const a1 = alongX ? x1 : z1;
    const free = Math.abs(hingeAlong - a0) > Math.abs(hingeAlong - a1) ? a0 : a1;
    const knobAlong = free + Math.sign(hingeAlong - free) * 0.1;
    if (alongX) {
      const zc = (z0 + z1) / 2;
      addKnob(door, knobAlong, zc + 0.045, "z", black);
      addKnob(door, knobAlong, zc - 0.045, "z", black);
    } else {
      const xc = (x0 + x1) / 2;
      addKnob(door, xc + 0.045, knobAlong, "x", black);
      addKnob(door, xc - 0.045, knobAlong, "x", black);
    }
    if (bathDoor) door.sign = -1;
    if (bedDoor) door.sign = 1;
  }

  [[1.0, 3.4], [0.4, 2.1], [0.2, -2.2], [-1.7, -4.0], [0.3, 0.3]].forEach(([x, z]) => {
    addColumn(x, 2.4, z, 0.07, 0.03, bulb, 12);
  });
  addBaseboards();
  addDevices();
}

async function main() {
  const [levelJson, bin] = await Promise.all([
    fetch("level.json").then((r) => { if (!r.ok) throw new Error("level"); return r.json(); }),
    fetch("level.bin").then((r) => { if (!r.ok) throw new Error("bin"); return r.arrayBuffer(); }),
  ]);
  level = levelJson;
  blocked = hexBytes(level.blocked);
  inside = hexBytes(level.inside);
  widenWalk();
  peelWallSkin();
  doorOwner = hexBytes(level.doorOwner);
  state.x = level.spawn[0];
  state.y = level.spawn[1];
  state.z = level.spawn[2];

  renderer = new THREE.WebGLRenderer({ canvas: view, antialias: true });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = false;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(78, 1, 0.05, 40);
  scene.add(camera);

  ambient = new THREE.AmbientLight(0xfff1dd, 0.18);
  hemi = new THREE.HemisphereLight(0xd5dde6, 0x3a2e26, 0);
  sun = new THREE.DirectionalLight(0xfff6ee, 0);
  sun.position.set(2.4, 6.2, 1.2);
  sun.target.position.set(0, 0.8, -0.4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  sun.shadow.camera.left = -7;
  sun.shadow.camera.right = 7;
  sun.shadow.camera.top = 8;
  sun.shadow.camera.bottom = -8;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 18;
  sun.shadow.bias = -0.00025;
  sun.shadow.normalBias = 0.035;
  scene.add(ambient, hemi, sun, sun.target);
  [[1.0, 3.4], [0.4, 2.1], [0.2, -2.2], [-1.7, -4.0], [0.3, 0.3]].forEach(([x, z]) => {
    const lamp = new THREE.PointLight(0xffe6c2, 0, 4.4, 2);
    lamp.position.set(x, 2.28, z);
    scene.add(lamp);
    cans.push(lamp);
  });
  const texLoader = new THREE.TextureLoader();
  const matByName = {};
  for (const [name, spec] of Object.entries(level.materials)) {
    matByName[name] = makeMaterial(spec, texLoader);
    matByName[name].userData.role = name;
  }
  finishPalette();

  const [minx, minz, maxx, maxz] = level.bounds;
  const ceilGeo = new THREE.PlaneGeometry((maxx - minx) + 1.2, (maxz - minz) + 1.2);
  ceiling = new THREE.Mesh(ceilGeo, new THREE.MeshStandardMaterial({ color: 0x1a120e, roughness: 0.96 }));
  ceiling.receiveShadow = true;
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.set((minx + maxx) / 2, level.ceiling - 0.02, (minz + maxz) / 2);
  scene.add(ceiling);

  let doorCursor = 0;
  for (const rec of level.meshes) {
    const mat = matByName[rec.mat] || matByName.material_1;
    const mesh = buildMesh(bin, rec, mat);
    if (rec.mat === "material_0" || rec.mat === "material_4") mesh.geometry.computeVertexNormals();
    if (rec.door) {
      const meta = level.doors[doorCursor++];
      const group = new THREE.Group();
      mesh.position.set(-meta.hinge[0], 0, -meta.hinge[1]);
      group.add(mesh);
      group.position.set(meta.hinge[0], 0, meta.hinge[1]);
      scene.add(group);
      const door = { meta, group, mesh, amount: 0, target: 0, sign: 1 };
      door.sign = chooseSwing(door);
      doors.push(door);
    } else {
      carveScan(mesh);
      scene.add(mesh);
    }
  }

  dressApartment();
  buildRoomEnv();
  applyLook();
  $("load").classList.add("hide");
  window.GAME = { state, doors, blockedAt, scene, camera, renderer, level };
  requestAnimationFrame(frame);
}

function startAudio() {
  if (audio) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  audio = new Ctx();
  if (audio.state === "suspended") audio.resume();
}

function beginTour() {
  if (state.started) return;
  state.started = true;
  $("cover").classList.add("hide");
  if (!document.body.classList.contains("touch")) view.requestPointerLock?.();
  startAudio();
}

$("cover").addEventListener("pointerup", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  beginTour();
});
view.addEventListener("click", () => {
  if (!state.started || document.body.classList.contains("touch")) return;
  view.requestPointerLock?.();
});
document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== view) return;
  state.yaw -= e.movementX * 0.0022;
  state.pitch -= e.movementY * 0.002;
  state.pitch = Math.max(-1.15, Math.min(1.15, state.pitch));
});
document.addEventListener("keydown", (e) => {
  const code = e.code.toLowerCase();
  const fresh = !keys.has(code);
  keys.add(code);
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  if (!fresh || !state.started) return;
  if (e.code === "KeyE") useFocused();
});
document.addEventListener("keyup", (e) => keys.delete(e.code.toLowerCase()));

function bindPointer(el, onMove, onEnd) {
  let pid = null;
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    el.setPointerCapture(e.pointerId);
    pid = e.pointerId;
    onMove(e);
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId !== pid) return;
    e.preventDefault();
    onMove(e);
  });
  const end = (e) => {
    if (e.pointerId !== pid) return;
    pid = null;
    onEnd();
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}

bindPointer($("dpad"), (e) => {
  const rect = $("dpad").getBoundingClientRect();
  const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const ny = ((e.clientY - rect.top) / rect.height) * 2 - 1;
  const dead = 0.2;
  touchMove.x = nx > dead ? 1 : nx < -dead ? -1 : 0;
  touchMove.y = ny < -dead ? 1 : ny > dead ? -1 : 0;
  $("dpad").querySelector(".up").classList.toggle("on", touchMove.y > 0);
  $("dpad").querySelector(".down").classList.toggle("on", touchMove.y < 0);
  $("dpad").querySelector(".left").classList.toggle("on", touchMove.x < 0);
  $("dpad").querySelector(".right").classList.toggle("on", touchMove.x > 0);
}, () => {
  touchMove.x = 0;
  touchMove.y = 0;
  $("dpad").querySelectorAll(".dir").forEach((dir) => dir.classList.remove("on"));
});

bindPointer($("lookstick"), (e) => {
  const stick = $("lookstick");
  const rect = stick.getBoundingClientRect();
  const max = Math.min(rect.width, rect.height) * 0.32;
  let dx = e.clientX - (rect.left + rect.width / 2);
  let dy = e.clientY - (rect.top + rect.height / 2);
  const len = Math.hypot(dx, dy) || 1;
  if (len > max) { dx *= max / len; dy *= max / len; }
  touchLook.x = dx / max;
  touchLook.y = dy / max;
  stick.querySelector(".nub").style.transform = "translate(" + dx + "px," + dy + "px)";
}, () => {
  touchLook.x = 0;
  touchLook.y = 0;
  $("lookstick").querySelector(".nub").style.transform = "translate(0px,0px)";
});

$("useBtn").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  e.stopPropagation();
  useFocused();
});
$("useBtn").addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("resize", () => { if (renderer) resize(); });

main().catch((err) => {
  $("load").textContent = "COULD NOT OPEN THE FLOOR PLAN";
  console.error(err);
});
</script>
